# This file is maintained in this repository, not generated by a copier template.
# It came from gh:LabAutomationAndScreening/copier-python-package-template, which this repo no longer
# instantiates from; the nuxt template that replaced it ships no Sphinx docs.
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/conf.py
   fail_on_warning: True

# Optionally, but recommended,
# declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
# The project itself is deliberately not installed: the docs are hand-written reStructuredText with no
# autodoc directives, so nothing here imports the package. conf.py loads sphinx.ext.autodoc but no page
# uses it. Installing it would also mean pointing pip at backend/, since there is no longer a project at
# the repository root.
python:
    install:
    - requirements: docs/requirements.txt

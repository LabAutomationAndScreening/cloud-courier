version: '3'

vars:
  APP_NAME: cloud-courier
  DIST_DIR: ./backend/dist/{{.APP_NAME}}

tasks:
  copy-frontend-static:
    desc: Copy the generated frontend bundle into the backend static directory it is served from
    cmds:
      # git clean rather than rm -rf: this directory also holds tracked files (favicon.ico, the .gitignore itself,
      # the vendored GraphiQL assets) that must survive. -x covers the gitignored build output, which is the stale part.
      - git clean -xdf ./backend/src/static
      - cp -a ./frontend/.output/public/. ./backend/src/static/

  bundle-executable:
    # The single definition of the pyinstaller invocation. Callers supply PYINSTALLER_ARGS for whatever their
    # context needs; keeping the base command here is what stops the local and CI builds from drifting apart.
    internal: true
    cmds:
      - uv --directory=backend run pyinstaller pyinstaller.spec {{.PYINSTALLER_ARGS}}

  build-executable:
    desc: Generate the frontend, bundle it into the backend, and build the single-file executable
    cmds:
      - task: build-frontend
      - task: copy-frontend-static
      - task: bundle-executable
        vars:
          PYINSTALLER_ARGS: --noconfirm

  bundle-executable-from-staged-static:
    desc: Build the executable from static assets already present in backend/src/static, with a verbose build log
    cmds:
      - task: bundle-executable
        vars:
          PYINSTALLER_ARGS: --log-level=DEBUG

  run-stack:
    desc: Build the full stack and run it
    cmds:
      - task: build-executable
      - "{{.DIST_DIR}}/{{.APP_NAME}}"

  reload-frontend-in-stack:
    desc: Rebuild only the frontend, swap it into the already-built executable, and run it
    cmds:
      - task: build-frontend
      - rm -rf "{{.DIST_DIR}}/_internal/static"
      - task: copy-frontend-static
      - cp -a ./backend/src/static "{{.DIST_DIR}}/_internal/static"
      - "{{.DIST_DIR}}/{{.APP_NAME}}"

version: '3'

tasks:
  dev-backend:
    desc: Start the API server on port 4000 with autoreload (does not write log files)
    cmds:
      - uv --directory=backend run uvicorn src.entrypoint:app --reload --host '::' --port 4000

  run-backend-entrypoint:
    desc: Run the backend through its CLI entrypoint on port 4000, which accepts CLI options and logs to file
    cmds:
      - uv --directory=backend run python src/entrypoint.py

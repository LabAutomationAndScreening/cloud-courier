name: Install requirements
description: Setup Python and/or Node, and install dependencies based on the devcontainer specification
inputs:
  python-version:
    description: Python version to install
    required: false # if this is set, then assume you want python dependencies installed
    default: 'notUsing'
  node-version:
    description: Node version to install
    required: false # if this is set, then assume you want node dependencies installed
    default: 'notUsing'
  working-directory:
    description: Relative path to the directory holding the package.json to read the pnpm version from (its `packageManager` or `devEngines.packageManager` field). When unset, the pnpm version pinned by the template is used instead.
    required: false
    default: 'notUsing'
  install-deps:
    required: false
    default: true
    description: Whether to run the setup-deps script, or just to setup basic CI tooling
  skip-installing-ssm-plugin-manager:
    required: false
    default: false
    description: Whether to explicitly skip installing the SSM Plugin manager when setting up basic CI tooling
  project-dir:
    description: What's the relative path to the project?
    required: false
    default: ./
  code-artifact-auth-role-name:
    description: What's the role name to use for CodeArtifact authentication?
    required: false
    default: no-code-artifact
  code-artifact-auth-role-account-id:
    description: What's the AWS Account ID that the role is in?
    required: false
  code-artifact-auth-region:
    description: What region should the role use?
    required: false
  skip-updating-devcontainer-hash:
    description: Whether to skip updating the hash when running manual-setup-deps.py
    default: true
    required: false
  skip-installing-pulumi-cli:
    description: Whether to skip installing the Pulumi CLI even if the lock file references it
    default: false
    required: false


runs:
  using: composite
  steps:
    - name: Get version of python
      # TODO: be able to pull the default version from the devcontainer.json file
      run: |
        PYTHON_VERSION="${{ inputs.python-version }}"
        echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"
      shell: bash

    - name: Setup python
      if: ${{ inputs.python-version != 'notUsing' }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Locate the pnpm project # pnpm/setup keys the store cache off a lock file, so it can only cache when one exists in the directory the project lives in
      id: pnpm-project
      if: ${{ inputs.node-version != 'notUsing' }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        if [ "$WORKING_DIRECTORY" = "notUsing" ]; then
          project_dir="."
        else
          project_dir="$WORKING_DIRECTORY"
        fi
        echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
        if [ -f "$project_dir/pnpm-lock.yaml" ]; then
          echo "lock_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "lock_exists=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Setup pnpm and node # this action installs both pnpm and the node runtime, so actions/setup-node is not needed
      if: ${{ inputs.node-version != 'notUsing' }}
      uses: pnpm/setup@v2.1.0
      with:
        # an empty version makes pnpm/setup read it from the manifest in working-directory instead. Passing both a version and a package.json with a conflicting `packageManager` field is a hard error in pnpm/setup.
        version: ${{ inputs.working-directory == 'notUsing' && '12.4.2' || '' }}
        working-directory: ${{ steps.pnpm-project.outputs.dir }}
        # cache-dependency-path is left at its default, which is the lock file inside working-directory -- the same one the probe above checks
        runtime: node@${{ inputs.node-version }}
        cache: ${{ steps.pnpm-project.outputs.lock_exists }}
        install: false # dependency installation is handled by manual-setup-deps.py, which knows about every environment in the repo

    - name: Install tooling
      # the funky syntax is github action ternary
      # --no-node is always passed because the only node tooling this script installs is pnpm, which pnpm/setup above already installed
      run: python .devcontainer/install-ci-tooling.py ${{ inputs.python-version == 'notUsing' && '--no-python' || '' }} --no-node ${{ inputs.skip-installing-ssm-plugin-manager == 'true' && '--skip-installing-ssm-plugin' || '' }}
      shell: pwsh

    - name: OIDC Auth for CodeArtifact
      if: ${{ inputs.code-artifact-auth-role-name != 'no-code-artifact' }}
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ inputs.code-artifact-auth-role-account-id }}:role/${{ inputs.code-artifact-auth-role-name }}
        aws-region: ${{ inputs.code-artifact-auth-region }}

    - name: Install dependencies
      # the funky syntax is github action ternary
      if: ${{ inputs.install-deps == 'true' }}
      run: python .devcontainer/manual-setup-deps.py ${{ inputs.python-version == 'notUsing' && '--no-python' || '' }} ${{ inputs.node-version == 'notUsing' && '--no-node' || '' }} ${{ inputs.skip-updating-devcontainer-hash == 'true' && '--skip-updating-devcontainer-hash' || '' }} ${{ inputs.skip-installing-pulumi-cli == 'true' && '--skip-installing-pulumi-cli' || '' }}
      shell: pwsh

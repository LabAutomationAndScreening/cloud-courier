name: CI

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**' # don't run (again) when on these special branches created during merge groups; the `on: merge_group` already triggers it.
  merge_group:
  pull_request:

env:
  PYTHONUNBUFFERED: True
  PRE_COMMIT_HOME: ${{ github.workspace }}/.precommit_cache

permissions:
  id-token: write # needed to assume OIDC roles (e.g. for downloading from CodeArtifact)
  contents: read # need to explicitly provide this whenever defining permissions because the default value is 'none' for anything not explicitly set when permissions are defined

jobs:
  get-values:
    uses: ./.github/workflows/get-values.yaml
    permissions:
      contents: write # needed for updating dependabot branches

  check-skip-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read # needed to check if PR exists for current branch
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: check
        uses: ./.github/actions/check-skip-duplicates

  lint:
    needs:
      - get-values
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    name: Pre-commit
    uses: ./.github/workflows/pre-commit.yaml
    permissions:
      contents: write # needed for mutex
      id-token: write # needed to assume OIDC roles (e.g. for downloading from CodeArtifact)
    with:
      python-version: 3.13.9
      setup-node: true
      node-version: 24.11.1

  unit-test-frontend:
    name: Unit Test Frontend
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    needs:
      - lint
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install latest versions of packages
        uses: ./.github/actions/install_deps
        env:
          SKIP_PLAYWRIGHT_INSTALL: "1"
        with:
          node-version: 24.11.1
          skip-installing-ssm-plugin-manager: true

      - name: Unit test
        run: pnpm --dir=frontend test-unit

      - name: Upload test coverage on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-test-coverage
          path: frontend/.coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5

  unit-test-backend:
    name: Unit Test Backend
    timeout-minutes: 8
    needs:
      - lint
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install latest versions of python packages
        uses: ./.github/actions/install_deps
        with:
          python-version: 3.13.9
          skip-installing-ssm-plugin-manager: true

      - name: Unit test
        run: uv --directory=backend run pytest tests/unit --durations=5

      - name: Upload test coverage on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-test-coverage-${{ matrix.os }}
          path: backend/coverage-report-pytest
          if-no-files-found: error
          retention-days: 5

  build-frontend:
    needs:
      - lint
      - unit-test-frontend
      - unit-test-backend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'

    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install latest versions of node packages
        uses: ./.github/actions/install_deps
        env:
          SKIP_PLAYWRIGHT_INSTALL: "1"
        with:
          node-version: 24.11.1
          skip-installing-ssm-plugin-manager: true

      - name: Build frontend
        run: task build-frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-static-assets
          path: frontend/.output/public/**/*
          if-no-files-found: error
          retention-days: 5




  build-backend:
    needs:
      - lint
      - unit-test-frontend
      - unit-test-backend
      - build-frontend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - windows-2025-vs2026
    timeout-minutes: 8
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Download Frontend Static Assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-static-assets
          path: backend/src/static

      - name: Install latest versions of python packages
        uses: ./.github/actions/install_deps
        with:
          python-version: 3.13.9
          skip-installing-ssm-plugin-manager: true

      - name: Build application
        run: task bundle-executable-from-staged-static
      - name: Tar files to preserve permissions on Linux during artifact upload # https://github.com/actions/upload-artifact?tab=readme-ov-file#permission-loss
        run: tar -cvf app.tar backend/dist/cloud-courier
      - name: Upload application artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: built-cloud-courier-${{ matrix.os }}
          path: backend/dist/cloud-courier/**/*
          if-no-files-found: error
          retention-days: 5
      - name: Upload application artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: built-cloud-courier-${{ matrix.os }}
          path: app.tar
          if-no-files-found: error
          retention-days: 5


  test-compiled-frontend-dev:
    name: Test the compiled Frontend for pnpm dev mode
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    needs:
      - build-frontend
      - build-backend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install latest versions of node packages
        uses: ./.github/actions/install_deps
        with:
          node-version: 24.11.1
          skip-installing-ssm-plugin-manager: true

      - name: Test
        run: pnpm --dir=frontend test-compiled-dev

  e2e-test-windows-service:
    name: Windows Service Smoke Tests
    timeout-minutes: 15
    runs-on: windows-2025-vs2026
    needs:
      - build-backend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install latest versions of python packages
        uses: ./.github/actions/install_deps
        with:
          python-version: 3.13.9
          skip-installing-ssm-plugin-manager: true

      - name: Download Built executable
        uses: actions/download-artifact@v8.0.1
        with:
          name: built-cloud-courier-windows-2025-vs2026
          path: backend/dist/cloud-courier

      - name: Windows service smoke tests
        run: uv --directory=backend run pytest tests/windows_service --durations=5 --basetemp=dist/pytest-tmp

      - name: Dump service crash logs on failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $dumps = Get-ChildItem -Path "backend/dist/pytest-tmp" -Recurse -Filter "service-crash.log" -ErrorAction SilentlyContinue
          if ($dumps.Count -eq 0) {
            Write-Host "No service-crash.log files found under backend/dist/pytest-tmp"
          } else {
            foreach ($dump in $dumps) {
              Write-Host "=== $($dump.FullName) ==="
              Get-Content $dump.FullName
            }
          }

      - name: Upload service logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-service-logs
          path: backend/dist/pytest-tmp/**/service-logs/**
          if-no-files-found: warn
          retention-days: 5

  build-installer:
    needs:
      - build-backend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    permissions:
      contents: read
      actions: read # build-installer.yaml downloads the built bundle artifact
    # Intentionally no `secrets: inherit` here (unlike the release job, which passes it when
    # signing is enabled): CI builds an unsigned MSI as a build-breakage check; release signs it.
    uses: ./.github/workflows/build-installer.yaml


  e2e-test:
    name: End-to-end Testing
    timeout-minutes: 45
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    needs:
      - build-frontend
      - build-backend
      - check-skip-duplicate
    if: needs.check-skip-duplicate.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install latest versions of node packages
        uses: ./.github/actions/install_deps
        with:
          node-version: 24.11.1
      - name: Download Built executable
        uses: actions/download-artifact@v8.0.1
        with:
          name: built-cloud-courier-${{ matrix.os }}
          path: backend/dist/cloud-courier
      - name: Untar the artifact (on Linux)
        if: runner.os == 'Linux'
        run: tar -xvf backend/dist/cloud-courier/app.tar -C .

      - name: E2E test
        run: pnpm --dir=frontend test-e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 5



  confirm-on-tagged-copier-template:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: ./.github/workflows/confirm-on-tagged-copier-template.yaml

  workflow-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - get-values
      - check-skip-duplicate
      - lint
      - unit-test-frontend
      - build-frontend
      - unit-test-backend
      - build-backend
      - test-compiled-frontend-dev
      - e2e-test-windows-service
      - build-installer
      - e2e-test
      - confirm-on-tagged-copier-template
    permissions:
      statuses: write # needed for updating status on Dependabot PRs
    if: always()
    steps:
      - name: fail if prior job failure
        # Iterating the needs context keeps this gate from drifting out of sync with the job list above
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # these are the possibilities: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
          not_ok=$(jq -r 'to_entries[] | select(.value.result | test("^(skipped|success)$") | not) | .key' <<<"$NEEDS")

          if [[ -n "$not_ok" ]]; then
            echo "❌ One or more jobs did not finish with skipped or success:"
            echo "$not_ok"
            exit 1
          fi
          echo "✅ All jobs finished with skipped or success"

      - name: Mark the required-check as succeeded so the PR can be merged
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST -H "Accept: application/vnd.github.v3+json" \
            "${{ github.event.pull_request.statuses_url }}" \
            -f state=success -f context="required-check" -f description="✅ All required checks passed in the job triggered by pull_request" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark updated dependabot hash commit as succeeded
        if: needs.get-values.outputs.dependabot-commit-created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST -H "Accept: application/vnd.github.v3+json" \
            "/repos/${{ github.repository }}/statuses/${{ needs.get-values.outputs.new-dependabot-sha }}" \
            -f state=success -f context="required-check" -f description="Initial CI run passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
